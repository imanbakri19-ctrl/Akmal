<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Integration Calculator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fb;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 800px;
        }
        h1 {
            text-align: center;
            color: #1a73e8;
            margin-top: 0;
        }
        .calculator-interface {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }
        /* Desmos-like integration layout structure */
        .integral-equation {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-family: "Times New Roman", Times, serif;
            gap: 5px;
            background: #fafafa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        .integral-bounds {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 90px;
            font-size: 1rem;
        }
        .integral-bounds input {
            width: 60px;
            padding: 4px;
            font-size: 1rem;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .integral-sign {
            font-size: 4.5rem;
            line-height: 1;
            color: #333;
        }
        .expression-input {
            width: 200px;
            padding: 8px;
            font-size: 1.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
        }
        .variable-dx {
            font-size: 1.8rem;
            font-style: italic;
            margin-left: 5px;
        }
        .equals-sign {
            margin: 0 10px;
        }
        .result-display {
            font-weight: bold;
            color: #1a73e8;
            min-width: 120px;
            font-family: monospace;
        }
        .error-message {
            color: #d93025;
            text-align: center;
            font-size: 0.95rem;
            height: 20px;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 400px;
        }
        .hint {
            font-size: 0.85rem;
            color: #666;
            text-align: center;
            margin-top: -10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Definite Integration Calculator</h1>
    <p class="hint">Supports math syntax like: <code>x^2</code>, <code>sin(x)</code>, <code>exp(x)</code>, <code>1/x</code></p>
    
    <div class="calculator-interface">
        <div class="integral-equation">
            <div class="integral-bounds">
                <input type="text" id="param-b" value="3" placeholder="b" title="Upper bound">
                <input type="text" id="param-a" value="0" placeholder="a" title="Lower bound">
            </div>
            
            <div class="integral-sign">∫</div>
            
            <input type="text" id="param-f" value="x^2 - 2x + 2" class="expression-input" placeholder="f(x)" title="Function of x">
            
            <div class="variable-dx">dx</div>
            <div class="equals-sign">=</div>
            
            <div id="result" class="result-display">0</div>
        </div>
        
        <div id="error" class="error-message"></div>
    </div>

    <div class="canvas-container">
        <canvas id="plotChart"></canvas>
    </div>
</div>

<script>
    let chart;
    const ctx = document.getElementById('plotChart').getContext('2d');

    // Setup Event Listeners for immediate updates on keystroke/input
    document.getElementById('param-a').addEventListener('input', calculateAndPlot);
    document.getElementById('param-b').addEventListener('input', calculateAndPlot);
    document.getElementById('param-f').addEventListener('input', calculateAndPlot);

    // Initial calculation
    calculateAndPlot();

    function calculateAndPlot() {
        const aStr = document.getElementById('param-a').value;
        const bStr = document.getElementById('param-b').value;
        const fStr = document.getElementById('param-f').value;
        const errorDiv = document.getElementById('error');
        const resultDiv = document.getElementById('result');

        errorDiv.textContent = "";

        try {
            // Parse bounds with math.js so users can type things like "pi" or "sqrt(2)"
            const a = math.evaluate(aStr);
            const b = math.evaluate(bStr);
            
            if (typeof a !== 'number' || typeof b !== 'number' || isNaN(a) || isNaN(b)) {
                throw new Error("Bounds must evaluate to real numbers.");
            }

            // Compile the math expression safely
            const expr = math.compile(fStr);

            // 1. Numerical Integration using Simpson's Rule
            const n = 1000; // number of intervals (must be even for Simpson's)
            const h = (b - a) / n;
            
            let integrationResult = 0;
            if (h !== 0) {
                let sum = expr.evaluate({x: a}) + expr.evaluate({x: b});
                
                for (let i = 1; i < n; i++) {
                    const x = a + i * h;
                    const val = expr.evaluate({x: x});
                    if (typeof val !== 'number' || isNaN(val)) throw new Error("Function evaluation error.");
                    
                    if (i % 2 === 0) {
                        sum += 2 * val;
                    } else {
                        sum += 4 * val;
                    }
                }
                integrationResult = (h / 3) * sum;
            }

            // Update numerical result UI (rounded nicely)
            resultDiv.textContent = Number(integrationResult.toFixed(5)).toString();

            // 2. Generate Chart Data
            // We want the view window to stretch slightly wider than the bounds [a, b]
            const padding = Math.max(Math.abs(b - a) * 0.3, 1);
            const startX = Math.min(a, b) - padding;
            const endX = Math.max(a, b) + padding;
            
            const totalPoints = 200;
            const step = (endX - startX) / totalPoints;

            const mainLineData = [];
            const shadedAreaData = [];

            for (let i = 0; i <= totalPoints; i++) {
                const currentX = startX + (i * step);
                let currentY;
                try {
                    currentY = expr.evaluate({x: currentX});
                } catch(e) {
                    currentY = null;
                }

                if (typeof currentY === 'number' && !isNaN(currentY)) {
                    mainLineData.push({x: currentX, y: currentY});
                    
                    // Populate data points specifically inside the defined [a, b] bounds for shading
                    if (currentX >= Math.min(a, b) && currentX <= Math.max(a, b)) {
                        shadedAreaData.push({x: currentX, y: currentY});
                    }
                }
            }

            // Always ensure exact boundaries are included in the shaded area dataset
            try {
                const minBound = Math.min(a,b);
                const maxBound = Math.max(a,b);
                shadedAreaData.unshift({x: minBound, y: expr.evaluate({x: minBound})});
                shadedAreaData.push({x: maxBound, y: expr.evaluate({x: maxBound})});
                shadedAreaData.sort((m, n) => m.x - n.x);
            } catch(e){}

            // Update or Initialize Chart.js graph
            if (chart) {
                chart.data.datasets[0].data = mainLineData;
                chart.data.datasets[1].data = shadedAreaData;
                chart.update('none'); // Update smoothly without reset animations
            } else {
                chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        datasets: [
                            {
                                label: 'f(x)',
                                data: mainLineData,
                                borderColor: '#1a73e8',
                                borderWidth: 3,
                                pointRadius: 0,
                                fill: false,
                                tension: 0.1
                            },
                            {
                                label: 'Integrated Area',
                                data: shadedAreaData,
                                backgroundColor: 'rgba(26, 115, 232, 0.2)',
                                borderColor: 'transparent',
                                pointRadius: 0,
                                fill: 'origin' // Fills down/up to the y=0 axis line
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            x: {
                                type: 'linear',
                                position: 'bottom',
                                grid: { color: '#e0e0e0' }
                            },
                            y: {
                                type: 'linear',
                                grid: { color: '#e0e0e0' }
                            }
                        }
                    }
                });
            }

        } catch (err) {
            resultDiv.textContent = "—";
            errorDiv.textContent = "Error: " + err.message;
        }
    }
</script>

</body>
</html>
